- name: Add monitoring namespace
  kubernetes.core.k8s:
    state: present
    kubeconfig: /etc/kubernetes/admin.conf
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: monitoring

- name: Create rook-ceph PVC for prometheus
  kubernetes.core.k8s:
    kubeconfig: /etc/kubernetes/admin.conf
    state: present
    definition:
      kind: PersistentVolumeClaim
      apiVersion: v1
      metadata:
        name: prometheus-datadir-0
        namespace: monitoring
      spec:
        storageClassName: rook-ceph-block
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 2Gi
  register: _obj_add
  until: _obj_add.failed is not true
  # ignore_errors: true
  retries: 5
  delay: 3
- name: Debug
  debug:
    var: _obj_add

- name: Add Prometheus Helm repository
  kubernetes.core.helm_repository:
    name: prometheus-community
    repo_url: "https://prometheus-community.github.io/helm-charts"
  register: _repo_add
  until: _repo_add.failed is not true
  # ignore_errors: true
  retries: 5
  delay: 3
- name: Debug
  debug:
    var: _repo_add
- name: Install Prometheus
  kubernetes.core.helm:
    name: prometheus
    release_namespace: "monitoring"
    force: true
    wait: true
    create_namespace: true
    chart_ref: prometheus-community/prometheus
    kubeconfig: /etc/kubernetes/admin.conf
    update_repo_cache: true
    values:
      server:
        persistentVolume:
            enabled: true
            # use rook-ceph
            existingClaim: "prometheus-datadir-0"
  register: _install_package
  until: _install_package.failed is not true
  # ignore_errors: true
  retries: 10
  delay: 3
- name: Debug
  debug:
    var: _install_package

