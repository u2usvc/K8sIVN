- name: Create private key with password protection
  community.crypto.openssl_privatekey:
    path: /etc/ssl/coolcorp.key
    passphrase: "{{ secret_ca_passphrase }}"

- name: Create certificate signing request (CSR) for CA certificate
  community.crypto.openssl_csr_pipe:
    privatekey_path: /etc/ssl/coolcorp.key
    privatekey_passphrase: "{{ secret_ca_passphrase }}"
    common_name: Ansible CA
    use_common_name_for_san: false  # since we do not specify SANs, don't use CN as a SAN
    basic_constraints:
      - 'CA:TRUE'
    basic_constraints_critical: true
    key_usage:
      - keyCertSign
    key_usage_critical: true
  register: ca_csr

- name: Create self-signed CA certificate from CSR
  community.crypto.x509_certificate:
    path: /etc/ssl/certs/coolcorp.pem
    csr_content: "{{ ca_csr.csr }}"
    privatekey_path: /etc/ssl/coolcorp.key
    privatekey_passphrase: "{{ secret_ca_passphrase }}"
    provider: selfsigned


- name: Generate private key if not exists
  community.crypto.openssl_privatekey:
    path: /root/coreos04.k8s.lab.key
    size: 2048
    state: present

- name: Create certificate signing request (CSR) for gitlab cert
  community.crypto.openssl_csr_pipe:
    privatekey_path: /root/coreos04.k8s.lab.key
    common_name: coreos04.k8s.lab 
    organization_name: Coolcorp, Inc.
    subject_alt_name:
      - "DNS:coreos04.k8s.lab"
      - "DNS:kas.coreos04.k8s.lab"
  register: csr

- name: Create self-signed certificate from CSR
  community.crypto.x509_certificate:
    path: /root/coreos04.k8s.lab.pem
    csr_content: "{{ csr.csr }}"
    privatekey_path: /root/coreos04.k8s.lab.key
    provider: ownca
    ownca_path: /etc/ssl/certs/coolcorp.pem
    ownca_privatekey_path: /etc/ssl/coolcorp.key
    ownca_privatekey_passphrase: "{{ secret_ca_passphrase }}"

- name: Copy the key into the container
  community.docker.docker_container_copy_into:
    container: gitlab-local-0
    path: /root/coreos04.k8s.lab.key
    container_path: /etc/gitlab/coreos04.k8s.lab.key
- name: Copy the cert into the container
  community.docker.docker_container_copy_into:
    container: gitlab-local-0
    path: /root/coreos04.k8s.lab.pem
    container_path: /etc/gitlab/coreos04.k8s.lab.pem

- name: Push certificates inside GL container
  community.docker.docker_container_exec:
    container: gitlab-local-0
    command: /bin/bash -c "[ -d /etc/gitlab/ssl ] || mkdir /etc/gitlab/ssl && chmod 755 /etc/gitlab/ssl && mv -t /etc/gitlab/ssl/ /etc/gitlab/coreos04.k8s.lab.pem /etc/gitlab/coreos04.k8s.lab.key"
  register: _debug
  until: _debug.failed is not true
  retries: 5
  delay: 3


- name: Copy gitlab.rb inside the machine
  ansible.builtin.copy:
    src: ../files/gitlab.rb
    dest: /tmp/gitlab.rb
    owner: root
    group: root
    mode: '0644'
- name: Copy gitlab.rb into the container
  community.docker.docker_container_copy_into:
    container: gitlab-local-0
    path: /tmp/gitlab.rb
    container_path: /etc/gitlab/gitlab.rb


- name: Execute gitlab-ctl reconfigure
  community.docker.docker_container_exec:
    container: gitlab-local-0
    command: gitlab-ctl reconfigure
  register: _debug
  until: _debug.failed is not true
  retries: 5
  delay: 3


- name: Fetch CA cert from mon to control node
  ansible.builtin.fetch:
    src: /etc/ssl/certs/coolcorp.pem
    dest: /tmp/coolcorp.pem
    flat: yes
- name: Copy CA cert to a dedicated directory
  copy:
    src: /tmp/coolcorp.pem
    dest: /etc/pki/ca-trust/source/anchors/coolcorp.pem
    owner: root
    group: root
    mode: '0644'
- name: update CA trust
  shell: update-ca-trust
  register: _debug
  # ignore_errors: true
- name: Debug
  debug:
    var: _debug


- name: Wait for GitLab to become available
  uri:
    url: "https://coreos04.k8s.lab/users/sign_in"
    method: GET
    status_code: 200
  register: gitlab_status
  retries: 30
  delay: 10
  until: gitlab_status.status == 200





