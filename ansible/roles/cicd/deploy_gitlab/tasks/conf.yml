- name: Generate SSH key pair
  ansible.builtin.openssh_keypair:
    path: "/root/.ssh/gitlab_admin"
    size: 2048
    type: rsa
    force: true
  register: ssh_key_pair
- name: change key permissions
  ansible.builtin.file:
    path: "/root/.ssh/gitlab_admin"
    mode: '0600'

- name: Define SSH public key
  set_fact:
    ssh_pub_key: "{{ ssh_key_pair.public_key }}"

    # curl -d '{"title":"test key","key":" {{ ssh_key }} "}' -H 'Content-Type: application/json' https://coreos04.k8s.lab/api/v4/user/keys?private_token='{{ gitlab_token }}
- name: Add SSH key to the user
  uri:
    url: "https://coreos04.k8s.lab/api/v4/user/keys?private_token={{ gitlab_token }}"
    method: POST
    headers:
      Content-Type: "application/json"
    body: '{"title": "test key", "key": "{{ ssh_pub_key }}"}'
    body_format: json
    status_code: 201
  register: result

- name: Print result of key addition
  debug:
    msg: "{{ result }}"


